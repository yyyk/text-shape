# Release: run by hand from the Actions tab ("Run workflow") on main.
#
# Before running it, bump the version in Cargo.toml ([workspace.package]
# version) and js/package.json to the same x.y.z, and turn the changelog's
# "## [Unreleased]" into a dated "## [x.y.z] - YYYY-MM-DD" entry, then merge that
# to main. The workflow then:
#
#   1. checks the versions match, the CHANGELOG entry exists and is dated, and
#      the tag vX.Y.Z doesn't exist yet;
#   2. builds and tests everything (Rust, WASM, npm package) and checks what
#      would be published;
#   3. creates the tag and a GitHub release with the CHANGELOG entry as notes;
#   4. publishes the Rust crate to crates.io, then the npm package, with
#      provenance.
#
# Publishing is last because it can't be undone; if a publish fails, retry it by
# hand (or delete the release and tag and run the workflow again).
#
# Authentication uses trusted publishing on both registries (no tokens stored):
# - crates.io: in the crate's Settings → Trusted Publishing, add this repository
#   and the workflow file `release.yml`.
# - npmjs.com: in the package's settings, add this repository and the workflow
#   file `release.yml` as a trusted publisher.
# Both packages have to exist first, so the very first version is published by
# hand (`cargo publish -p text-shape`, and `npm publish` in js/).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write # create the tag and the GitHub release
  id-token: write # trusted publishing (crates.io, npm) and npm provenance

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to check the new one doesn't exist

      - name: Check versions, CHANGELOG and tag
        id: version
        run: |
          version=$(node -p "require('./js/package.json').version")
          crate_version=$(cargo metadata --no-deps --format-version 1 \
            | node -p "JSON.parse(require('fs').readFileSync(0)).packages.find(p => p.name === 'text-shape').version")
          if [ "$version" != "$crate_version" ]; then
            echo "::error::js/package.json is $version but the text-shape crate is $crate_version"; exit 1
          fi
          if ! grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs a dated entry: ## [$version] - YYYY-MM-DD"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists"; exit 1
          fi
          # Release notes: the CHANGELOG entry, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Rust — format, lint, test, check what would be published
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo publish -p text-shape --dry-run
      - name: npm package — build, test, check contents
        working-directory: js
        run: |
          npm ci
          npm test
          npm publish --dry-run

      - name: Create the tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          --target "$GITHUB_SHA"
          --title "text-shape ${{ steps.version.outputs.version }}"
          --notes-file release-notes.md

      - name: Get a crates.io token (trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - name: Publish to crates.io
        run: cargo publish -p text-shape
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Publish to npm
        working-directory: js
        run: npm publish --provenance --access public
