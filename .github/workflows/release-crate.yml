# Release the Rust crate: run by hand from the Actions tab ("Run workflow") on main.
#
# Before running it, bump the version in Cargo.toml ([workspace.package]
# version) and turn the "## [Unreleased]" in crates/text-shape/CHANGELOG.md into
# a dated "## [x.y.z] - YYYY-MM-DD" entry, then merge that to main. The workflow
# then:
#
#   1. checks the CHANGELOG entry exists and is dated, and the tag crate-vX.Y.Z
#      doesn't exist yet;
#   2. formats, lints and tests the workspace and checks what would be published;
#   3. creates the tag and a GitHub release with the CHANGELOG entry as notes;
#   4. publishes the crate to crates.io.
#
# Publishing is last because it can't be undone; if it fails, retry it by hand
# (or delete the release and tag and run the workflow again).
#
# Authentication uses trusted publishing (no tokens stored): in the crate's
# Settings → Trusted Publishing on crates.io, add this repository and the
# workflow file `release-crate.yml`. The crate has to exist first, so the very
# first version is published by hand (`cargo publish -p text-shape`).
name: Release crate

on:
  workflow_dispatch:

permissions:
  contents: write # create the tag and the GitHub release
  id-token: write # trusted publishing

concurrency:
  group: release-crate
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to check the new one doesn't exist

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check CHANGELOG and tag
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "text-shape") | .version')
          changelog=crates/text-shape/CHANGELOG.md
          if ! grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" "$changelog"; then
            echo "::error::$changelog needs a dated entry: ## [$version] - YYYY-MM-DD"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/crate-v$version" >/dev/null; then
            echo "::error::tag crate-v$version already exists"; exit 1
          fi
          # Release notes: the CHANGELOG entry, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' "$changelog" > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Format, lint, test, check what would be published
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo publish -p text-shape --dry-run

      - name: Create the tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "crate-v${{ steps.version.outputs.version }}"
          --target "$GITHUB_SHA"
          --title "text-shape crate ${{ steps.version.outputs.version }}"
          --notes-file release-notes.md

      - name: Get a crates.io token (trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - name: Publish to crates.io
        run: cargo publish -p text-shape
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
