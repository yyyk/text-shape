[package]
name = "text-shape"
description = "Text shaping, metrics, line breaking, bidi and paragraph layout on HarfRust"
keywords = ["text", "shaping", "typography", "layout", "font"]
categories = ["text-processing", "graphics"]
readme = "README.md"
documentation = "https://docs.rs/text-shape"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
harfrust = "0.16.0"
# The same version harfrust uses: its font types are read-fonts'.
read-fonts = "0.47.0"
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
serde = { version = "1.0.228", features = ["derive"], optional = true }

[package.metadata.docs.rs]
# Document the serde derives too.
all-features = true

[features]
## Serialize/Deserialize for the public data types.
serde = ["dep:serde"]
